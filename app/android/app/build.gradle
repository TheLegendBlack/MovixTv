apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Identité de l'application : celle du dépôt par défaut, remplacée par
// `edition.properties` quand il existe (identifiant, nom, numéros de version,
// icône et bannière). Ses ressources propres vont dans `src/edition/res`.
def editionPropertiesFile = rootProject.file("app/edition.properties")
def edition = new Properties()
if (editionPropertiesFile.exists()) {
    edition.load(new InputStreamReader(new FileInputStream(editionPropertiesFile), "UTF-8"))
}

android {
    namespace "com.movix.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId edition.getProperty("applicationId", "com.movix.app")
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(edition.getProperty("versionCode", "42"))
        versionName edition.getProperty("versionName", "2.6.5")

        resValue "string", "app_name", edition.getProperty("appName", "Movix")
        manifestPlaceholders = [
            appIcon: edition.getProperty("appIcon", "@mipmap/ic_launcher"),
            appRoundIcon: edition.getProperty("appRoundIcon", "@mipmap/ic_launcher_round"),
            appBanner: edition.getProperty("appBanner", "@drawable/tv_banner"),
        ]

        buildConfigField "int", "VERSION_CODE_INT", "${versionCode}"
        buildConfigField "String", "VERSION_NAME_STR", "\"${versionName}\""
    }

    buildFeatures {
        buildConfig true
    }

    // APK par processeur (26/10/2026) : en plus de l'APK universel (premier
    // téléchargement, l'utilisateur ne connaît pas son processeur), une variante
    // par ABI, ~20 Mo au lieu de ~38, que les mises à jour automatiques préfèrent.
    // Même versionCode pour toutes : pas de Play Store, donc pas besoin du
    // décalage par ABI, et l'APK universel comme les variantes se remplacent.
    // Réservé aux tâches release : le build debug garde ses quatre ABI (émulateurs).
    // AGP refuse `ndk.abiFilters` avec les splits ; la restriction aux deux ABI ARM
    // de l'APK universel passe donc par `packaging` (voir plus bas).
    def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    splits {
        abi {
            enable releaseBuild
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }
    if (releaseBuild) {
        packaging {
            jniLibs {
                excludes += ["**/x86/**", "**/x86_64/**"]
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['MOVIX_RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['MOVIX_RELEASE_STORE_FILE'])
                storePassword keystoreProperties['MOVIX_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['MOVIX_RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['MOVIX_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig keystoreProperties['MOVIX_RELEASE_STORE_FILE'] ? signingConfigs.release : signingConfigs.debug
            // Téléviseurs et boîtiers Android sont ARM : 64 bits pour les
            // récents et puissants, 32 bits pour l'entrée de gamme (l'Edenwood).
            // x86 et x86_64 ne servaient qu'aux émulateurs (et au Nexus Player,
            // arrêté en 2018) : 29 Mo sur 67,5 de l'APK, mesuré le 14/10/2026.
            // Le filtrage se fait par `splits.abi` et `packaging` (plus haut) et non
            // par `ndk.abiFilters`, incompatible avec les splits.
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['MOVIX_RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['MOVIX_RELEASE_STORE_FILE'])
                storePassword keystoreProperties['MOVIX_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['MOVIX_RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['MOVIX_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig keystoreProperties['MOVIX_RELEASE_STORE_FILE'] ? signingConfigs.release : signingConfigs.debug
            // Téléviseurs et boîtiers Android sont ARM : 64 bits pour les
            // récents et puissants, 32 bits pour l'entrée de gamme (l'Edenwood).
            // x86 et x86_64 ne servaient qu'aux émulateurs (et au Nexus Player,
            // arrêté en 2018) : 29 Mo sur 67,5 de l'APK, mesuré le 14/10/2026.
            // Chaque appareil prend toujours la meilleure variante qu'il sait
            // exécuter. Le build debug garde les quatre, pour les émulateurs.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            if (file("src/edition/res").exists()) res.srcDirs += "src/edition/res"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // play-services-cronet (et Cast recents) sont compiles avec des
        // metadonnees Kotlin 2.1 que le compilateur 1.9.24 (impose par le plugin
        // Gradle de RN 0.75.4) refuse par defaut. On consomme juste leur API
        // (CronetEngine, Tasks) -> on tolere la version de metadonnees.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Cronet (moteur reseau Chromium, charge depuis GMS) pour le proxy media :
    // les CDN fsvid/vidzy filtrent la signature TLS d'okhttp (bloque comme
    // scraper). Cronet presente la vraie signature Chrome -> le CDN sert le
    // vrai flux au lieu d'un 403 / leurre. Repli sur okhttp si Cronet indispo.
    // Voir CronetMediaProxyUpstream.
    implementation("com.google.android.gms:play-services-cronet:18.1.1")

    // Robolectric n'expose JUnit qu'au runtime : sans cette ligne tout
    // src/test/ echoue a la compilation sur "Unresolved reference: junit".
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")
}
